<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Ops — Ansible Dashboard</title>
<meta name="description" content="Ansible lab operations dashboard for managing Linux and Windows machines">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- ============ TOASTS ============ -->
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<div class="app">

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand-dot"></span>
      <span class="brand-text">Lab<span class="brand-accent">Ops</span></span>
    </div>
    <nav class="topbar-nav">
      <a href="/" class="nav-tab active">Console</a>
      <a href="/fleet" class="nav-tab">Fleet</a>
    </nav>
  </header>

  <!-- ============ MACHINE STRIP ============ -->
  <div class="machine-strip">
    <div class="strip-scroll">
      <div class="strip-group" data-os="linux">
        <span class="strip-label">Linux <span class="strip-count" id="linux-count">0</span></span>
        <ul class="fleet-list" id="linux-list" data-os="linux"></ul>
      </div>
      <div class="strip-sep"></div>
      <div class="strip-group" data-os="windows">
        <span class="strip-label win">Win <span class="strip-count" id="windows-count">0</span></span>
        <ul class="fleet-list" id="windows-list" data-os="windows"></ul>
      </div>
      <div class="fleet-empty" id="fleet-empty" hidden>No machines yet</div>
    </div>
    <div class="strip-right">
      <span class="selection-summary">
        <span id="selection-count">0</span> sel
        <button class="link-btn" id="select-all">all</button>
        <button class="link-btn" id="select-none">×</button>
      </span>
      <button class="add-toggle" id="remove-toggle" type="button" style="color: var(--red); border-color: var(--red-soft);">
        Remove
      </button>
      <button class="add-toggle" id="add-toggle" type="button">
        <span class="plus">+</span> Add
      </button>
    </div>
  </div>

  <!-- ============ ADD SYSTEM MODAL ============ -->
  <div class="modal-backdrop" id="add-form" hidden>
    <div class="modal" id="add-modal">
      <div class="modal-header">
        <h2 class="modal-title">Add a machine</h2>
        <button type="button" class="modal-close" id="add-cancel" aria-label="Close">&times;</button>
      </div>
      <form class="modal-body" id="add-form-inner">
        <div class="form-row">
          <div class="form-field full">
            <label for="host-name">Hostname or alias</label>
            <input type="text" id="host-name" placeholder="e.g. lab-web-03" autocomplete="off" required>
            <span class="field-hint">A name to identify this machine in the inventory</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="host-ip">IP address</label>
            <input type="text" id="host-ip" placeholder="192.168.1.42" autocomplete="off" required>
          </div>
          <div class="form-field">
            <label for="host-user">SSH / WinRM user <span class="optional">optional</span></label>
            <input type="text" id="host-user" placeholder="ansible" autocomplete="off">
          </div>
        </div>
        <div class="form-field">
          <label>Operating system</label>
          <div class="os-toggle" id="os-toggle">
            <button type="button" class="os-card active" data-os="linux">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M12.5 2c-.6 0-1.1.4-1.4.9-.2.5-.3 1-.2 1.6.1.5.3 1 .5 1.4-.5.1-1 .4-1.4.8-.4.4-.7.9-.8 1.5-.1.6 0 1.1.2 1.6-.6.3-1 .7-1.4 1.2-.3.5-.5 1.1-.5 1.7 0 .6.2 1.2.5 1.7.3.5.8.9 1.3 1.1-.1.3-.1.6-.1.9 0 .7.2 1.3.6 1.9.4.5.9.9 1.5 1.1-.1.5 0 1 .2 1.5.2.5.5.9.9 1.2H8.5v1h7v-1h-2.8c.4-.3.7-.7.9-1.2.2-.5.3-1 .2-1.5.6-.2 1.1-.6 1.5-1.1.4-.5.6-1.2.6-1.9 0-.3 0-.6-.1-.9.5-.2 1-.6 1.3-1.1.3-.5.5-1.1.5-1.7s-.2-1.2-.5-1.7c-.4-.5-.8-.9-1.4-1.2.2-.5.3-1.1.2-1.6-.1-.6-.4-1.1-.8-1.5-.4-.4-.9-.7-1.4-.8.2-.4.4-.9.5-1.4.1-.5 0-1.1-.2-1.6-.3-.5-.8-.9-1.4-.9z"/></svg>
              <span>Linux</span>
            </button>
            <button type="button" class="os-card" data-os="windows">
              <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 5.5l7.5-1v7H3V5.5zm0 13l7.5 1v-7H3v6zm8.5 1.2L21 21V12h-9.5v7.7zM11.5 4.3L21 3v9h-9.5V4.3z"/></svg>
              <span>Windows</span>
            </button>
          </div>
        </div>
        <div class="form-field">
          <label for="host-group">Inventory group <span class="optional">defaults to linux_lab / windows_lab</span></label>
          <input type="text" id="host-group" placeholder="linux_lab" autocomplete="off">
        </div>
        <p class="add-form-msg" id="add-form-msg"></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="add-cancel-btn">Cancel</button>
          <button type="submit" class="btn primary">Add machine</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ ACTIONS ============ -->
  <div class="actions-row">
    <div class="toolbar-actions">
      <button class="btn action" data-action="ping"><span class="btn-glow"></span>Ping</button>
      <button class="btn action" data-action="facts"><span class="btn-glow"></span>Facts</button>
      <button class="btn action" data-action="restart"><span class="btn-glow"></span>Restart</button>
      <button class="btn action danger" data-action="shutdown"><span class="btn-glow"></span>Shut down</button>
      <div class="install-group">
        <input type="text" id="package-name" placeholder="package…">
        <button class="btn action" data-action="install"><span class="btn-glow"></span>Install</button>
      </div>
    </div>
    <div class="smart-row">
      <input type="text" id="smart-prompt" placeholder="Describe a task — e.g. &quot;install nginx and open port 80&quot;">
      <label class="auto-apply">
        <input type="checkbox" id="auto-apply" checked>
        auto-apply
      </label>
      <button class="btn primary" id="smart-run"><span class="btn-glow"></span>Run</button>
    </div>
  </div>

  <!-- ============ PIPELINE TRACKER ============ -->
  <div class="pipeline" id="pipeline" hidden>
    <div class="pipeline-step" data-stage="facts">
      <div class="pipeline-node"><span class="pipeline-icon"></span></div>
      <span class="pipeline-label">Facts</span>
    </div>
    <div class="pipeline-wire"></div>
    <div class="pipeline-step" data-stage="generate">
      <div class="pipeline-node"><span class="pipeline-icon"></span></div>
      <span class="pipeline-label">Generate</span>
      <span class="pipeline-retry" id="pipeline-retry" hidden></span>
    </div>
    <div class="pipeline-wire"></div>
    <div class="pipeline-step" data-stage="lint">
      <div class="pipeline-node"><span class="pipeline-icon"></span></div>
      <span class="pipeline-label">Lint</span>
    </div>
    <div class="pipeline-wire"></div>
    <div class="pipeline-step" data-stage="dryrun">
      <div class="pipeline-node"><span class="pipeline-icon"></span></div>
      <span class="pipeline-label">Dry-run</span>
    </div>
    <div class="pipeline-wire"></div>
    <div class="pipeline-step" data-stage="apply">
      <div class="pipeline-node"><span class="pipeline-icon"></span></div>
      <span class="pipeline-label">Apply</span>
    </div>
  </div>

  <!-- ============ TERMINAL ============ -->
  <section class="terminal">
    <div class="terminal-titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="terminal-title">console</span>
      <span class="terminal-live" id="terminal-live"><span class="live-dot"></span>live</span>
      <button class="link-btn" id="clear-terminal">clear</button>
    </div>
    <div class="terminal-body" id="terminal-body"></div>
    <form class="terminal-input-row" id="terminal-form">
      <span class="prompt-glyph">&gt;</span>
      <input type="text" id="terminal-input" placeholder="type a command to run on selected machines…" autocomplete="off">
      <span class="cursor"></span>
    </form>
  </section>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
