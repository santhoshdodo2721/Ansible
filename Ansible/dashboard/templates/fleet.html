<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Overview — Lab Ops</title>
<meta name="description" content="Visual overview of all managed machines in your Ansible lab">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='fleet.css') }}">
</head>
<body class="fleet-page">

<nav class="topnav">
  <div class="topnav-brand">
    <span class="topnav-dot"></span>
    <span class="topnav-name">Lab<span class="topnav-accent">Ops</span></span>
  </div>
  <div class="topnav-links">
    <a href="/fleet" class="topnav-link active">Fleet</a>
    <a href="/" class="topnav-link">Console</a>
  </div>
  <div class="topnav-right">
    <button class="btn-refresh" id="btn-refresh" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 8A6 6 0 1 1 8 2"/><path d="M8 2L11 2L11 5"/></svg>
      Refresh status
    </button>
    <div class="fleet-stats" id="fleet-stats">
      <span class="stat"><span class="stat-n" id="stat-total">0</span> machines</span>
      <span class="stat-sep">·</span>
      <span class="stat online"><span class="stat-n" id="stat-online">0</span> online</span>
      <span class="stat-sep">·</span>
      <span class="stat offline"><span class="stat-n" id="stat-offline">0</span> offline</span>
    </div>
  </div>
</nav>

<main class="fleet-main">
  <div class="fleet-grid" id="fleet-grid">
    <div class="fleet-loading" id="fleet-loading">Loading machines…</div>
  </div>
</main>

<script src="{{ url_for('static', filename='fleet.js') }}"></script>
</body>
</html>
